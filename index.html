<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline PSE Stock Chart</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js for rendering the chart -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans">

    <div class="container mx-auto px-4 py-8 max-w-5xl">
        <!-- Header -->
        <header class="mb-6 border-b pb-4">
            <h1 class="text-3xl font-bold text-blue-900">📈 Offline PSE Stock Analysis</h1>
            <p class="text-gray-500 mt-1">100% Offline. Load your extracted local CSV/TXT data files.</p>
        </header>

        <!-- Controls Section -->
        <div class="bg-white p-6 rounded-lg shadow-sm border border-gray-200 mb-6 flex flex-col md:flex-row items-center justify-between gap-4">
            
            <div class="w-full">
                <label class="block text-sm font-bold text-gray-700 mb-2">1. Extract your .lzh file first.</label>
                <label class="block text-sm font-bold text-gray-700 mb-2">2. Upload the extracted .csv or .txt file here:</label>
                
                <!-- File Input for Local Data -->
                <input type="file" id="csvFileInput" accept=".csv, .txt" 
                    class="block w-full text-sm text-gray-500
                    file:mr-4 file:py-2 file:px-4
                    file:rounded-md file:border-0
                    file:text-sm file:font-semibold
                    file:bg-blue-50 file:text-blue-700
                    hover:file:bg-blue-100 cursor-pointer border border-gray-300 rounded-md p-2">
            </div>

        </div>

        <!-- Chart Container -->
        <div class="bg-white p-6 rounded-lg shadow-sm border border-gray-200 relative">
            <!-- Chart Canvas -->
            <div class="h-[500px] w-full">
                <canvas id="stockChart"></canvas>
            </div>
            
            <p id="errorMessage" class="text-red-500 mt-4 hidden font-medium bg-red-50 p-3 rounded"></p>
        </div>
    </div>

    <script>
        let currentChart = null;

        // Listen for when a file is selected
        document.getElementById('csvFileInput').addEventListener('change', function(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();

            // When the file is done reading
            reader.onload = function(e) {
                const text = e.target.result;
                processData(text, file.name);
            };

            // Read the file as text
            reader.readAsText(file);
        });

        // Parse the CSV/TXT data
        function processData(csvText, fileName) {
            const errorMessage = document.getElementById("errorMessage");
            errorMessage.classList.add("hidden");

            // Split file into lines
            const lines = csvText.split('\n').filter(line => line.trim() !== '');
            
            if (lines.length < 2) {
                showError("The file seems empty or invalid.");
                return;
            }

            const dates = [];
            const prices = [];

            // Simple parser: Most PSE CSVs look like "TICKER, DATE, OPEN, HIGH, LOW, CLOSE, VOL"
            // Or just "Date, Open, High, Low, Close"
            
            // Loop through lines (skipping the first row if it contains headers like 'Date')
            let startRow = isNaN(parseFloat(lines[0].split(',')[1])) ? 1 : 0;

            for (let i = startRow; i < lines.length; i++) {
                const columns = lines[i].split(',');

                // We need to guess which column is the Date and which is the Close Price.
                // Usually, Date is column 0 or 1, and Close is the second to last, or index 4/5.
                
                let dateCol, closeCol;

                // Typical format: TICKER, YYYYMMDD, OPEN, HIGH, LOW, CLOSE, VOLUME
                if (columns.length >= 6 && isNaN(columns[0])) { 
                    dateCol = columns[1];
                    closeCol = columns[5]; 
                } 
                // Typical format: Date, Open, High, Low, Close, Adj Close, Volume
                else if (columns.length >= 5) {
                    dateCol = columns[0];
                    closeCol = columns[4];
                } else {
                    continue; // Skip lines we can't understand
                }

                // Clean up the data
                const price = parseFloat(closeCol);
                
                // Format the date if it's YYYYMMDD
                let dateStr = dateCol.trim();
                if (dateStr.length === 8 && !dateStr.includes('-') && !dateStr.includes('/')) {
                    dateStr = `${dateStr.substring(0,4)}-${dateStr.substring(4,6)}-${dateStr.substring(6,8)}`;
                }

                if (!isNaN(price)) {
                    dates.push(dateStr);
                    prices.push(price);
                }
            }

            if (prices.length === 0) {
                showError("Could not find valid price data in this file. Please ensure it's a standard Stock CSV.");
                return;
            }

            // Reverse data if it goes from Newest -> Oldest (we want Oldest -> Newest left to right)
            if (new Date(dates[0]) > new Date(dates[dates.length - 1])) {
                dates.reverse();
                prices.reverse();
            }

            drawChart(dates, prices, fileName.replace('.csv', '').replace('.txt', ''));
        }

        function drawChart(labels, prices, stockName) {
            if (currentChart) {
                currentChart.destroy();
            }

            const ctx = document.getElementById('stockChart').getContext('2d');
            
            const isUp = prices[prices.length - 1] >= prices[0];
            const lineColor = isUp ? '#16a34a' : '#dc2626'; // Green if up, Red if down
            const fillColor = isUp ? 'rgba(22, 163, 74, 0.1)' : 'rgba(220, 38, 38, 0.1)';

            currentChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: `${stockName} - Closing Price`,
                        data: prices,
                        borderColor: lineColor,
                        backgroundColor: fillColor,
                        borderWidth: 2,
                        pointRadius: 0,
                        pointHoverRadius: 6,
                        fill: true,
                        tension: 0.1
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: { mode: 'index', intersect: false },
                    plugins: {
                        legend: { display: true, position: 'top' },
                        tooltip: { callbacks: { label: function(context) { return ' ₱' + context.parsed.y.toFixed(2); } } }
                    },
                    scales: {
                        x: { grid: { display: false }, ticks: { maxTicksLimit: 12 } },
                        y: { grid: { color: '#f1f5f9' }, ticks: { callback: function(value) { return '₱' + value; } } }
                    }
                }
            });
        }

        function showError(msg) {
            const err = document.getElementById("errorMessage");
            err.innerText = msg;
            err.classList.remove("hidden");
        }
    </script>
</body>
</html>
