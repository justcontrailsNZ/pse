<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PSE Stock Screener</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .table-container::-webkit-scrollbar { width: 8px; height: 8px; }
        .table-container::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans">

    <div class="container mx-auto px-4 py-8 max-w-4xl">
        <!-- Header -->
        <header class="mb-8">
            <h1 class="text-3xl font-bold text-blue-900">📈 PSE Stock Screener</h1>
            <p class="text-gray-500 mt-1">End-of-day data via Yahoo Finance. For study purposes.</p>
        </header>

        <!-- Filters Section -->
        <div class="bg-white p-6 rounded-lg shadow-sm border border-gray-200 mb-6">
            <h2 class="text-lg font-semibold mb-4 border-b pb-2">Screener Criteria</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                
                <!-- Max P/E Filter -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Max P/E Ratio</label>
                    <input type="number" id="maxPE" value="20" step="0.1"
                        class="w-full border border-gray-300 rounded-md p-2 focus:ring-blue-500 focus:border-blue-500 outline-none">
                </div>

                <!-- Min Div Yield Filter -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Min Dividend Yield (%)</label>
                    <input type="number" id="minDiv" value="2" step="0.1"
                        class="w-full border border-gray-300 rounded-md p-2 focus:ring-blue-500 focus:border-blue-500 outline-none">
                </div>

            </div>
            
            <div class="mt-6 flex justify-end gap-3">
                <button id="screenBtn" onclick="runScreener()" class="bg-blue-600 text-white px-5 py-2 rounded-md hover:bg-blue-700 transition font-medium flex items-center justify-center min-w-[150px]">
                    Run Screener
                </button>
            </div>
        </div>

        <!-- Results Table -->
        <div class="bg-white rounded-lg shadow-sm border border-gray-200 overflow-hidden">
            <div class="overflow-x-auto table-container">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-blue-50 border-b border-gray-200 text-sm uppercase text-gray-700">
                            <th class="p-4 font-semibold">Ticker</th>
                            <th class="p-4 font-semibold">P/E Ratio</th>
                            <th class="p-4 font-semibold">Dividend Yield</th>
                            <th class="p-4 font-semibold">Market Cap</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <tr>
                            <td colspan="4" class="p-8 text-center text-gray-500">
                                Click "Run Screener" to fetch and filter data.
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // List of stocks to check (Added a few more blue chips)
        const stocks = [
            "ALI.PS", "SM.PS", "BDO.PS", "JFC.PS",
            "AC.PS", "BPI.PS", "TEL.PS", "GLO.PS",
            "URC.PS", "MER.PS", "MBT.PS", "SMPH.PS"
        ];

        // Global variable to cache the downloaded data so we don't spam Yahoo API
        let cachedStockData = []; 
        let hasFetchedData = false;

        // Fetches a single stock's data
        async function getStockData(ticker) {
            const url = `https://query1.finance.yahoo.com/v10/finance/quoteSummary/${ticker}?modules=defaultKeyStatistics,summaryDetail`;
            
            try {
                const response = await fetch("https://api.allorigins.win/raw?url=" + encodeURIComponent(url));
                if (!response.ok) throw new Error("Network response was not ok");
                
                const data = await response.json();
                const result = data.quoteSummary.result[0];

                return {
                    ticker: ticker.replace(".PS", ""), // Clean up ticker name for display
                    pe: result.summaryDetail.trailingPE?.raw || null,
                    divYield: (result.summaryDetail.dividendYield?.raw || 0) * 100,
                    marketCap: (result.defaultKeyStatistics.marketCap?.raw || 0) / 1e9 // In Billions
                };

            } catch (error) {
                console.error(`Failed to fetch ${ticker}`, error);
                return null; // Return null if fetching fails
            }
        }

        // Main function triggered by the button
        async function runScreener() {
            const btn = document.getElementById("screenBtn");
            const tbody = document.getElementById("tableBody");

            const maxPE = parseFloat(document.getElementById("maxPE").value);
            const minDiv = parseFloat(document.getElementById("minDiv").value);

            // Step 1: Fetch data if we haven't already
            if (!hasFetchedData) {
                btn.disabled = true;
                btn.innerHTML = `<svg class="animate-spin -ml-1 mr-2 h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> Fetching Data...`;
                tbody.innerHTML = `<tr><td colspan="4" class="p-8 text-center text-blue-600 font-medium animate-pulse">Downloading market data from Yahoo Finance...</td></tr>`;

                // Promise.all fetches all stocks at the EXACT SAME TIME, making it 10x faster
                const rawData = await Promise.all(stocks.map(ticker => getStockData(ticker)));
                
                // Filter out any failed requests
                cachedStockData = rawData.filter(stock => stock !== null); 
                hasFetchedData = true;

                // Reset button state
                btn.disabled = false;
                btn.innerText = "Run Screener";
            }

            // Step 2: Apply Filters
            const filteredStocks = cachedStockData.filter(stock => {
                // Skip stocks with no P/E (negative earnings)
                if (stock.pe === null) return false;
                
                // Apply user criteria
                return stock.pe <= maxPE && stock.divYield >= minDiv;
            });

            // Step 3: Render to Table
            renderTable(filteredStocks);
        }

        // Handles creating the HTML rows
        function renderTable(data) {
            const tbody = document.getElementById("tableBody");
            tbody.innerHTML = "";

            if (data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" class="p-8 text-center text-gray-500">No stocks match your current criteria. Try adjusting your filters.</td></tr>`;
                return;
            }

            data.forEach(stock => {
                const row = document.createElement("tr");
                row.className = "border-b border-gray-100 hover:bg-gray-50 transition duration-150";
                row.innerHTML = `
                    <td class="p-4 font-bold text-blue-800">${stock.ticker}</td>
                    <td class="p-4 text-gray-700">${stock.pe.toFixed(2)}</td>
                    <td class="p-4 text-gray-700 font-medium text-green-600">${stock.divYield.toFixed(2)}%</td>
                    <td class="p-4 text-gray-600">₱${stock.marketCap.toFixed(2)} B</td>
                `;
                tbody.appendChild(row);
            });
        }
    </script>
</body>
</html>
