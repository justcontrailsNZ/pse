<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PSE Stock Performance Chart</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js for drawing the graph -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans">

    <div class="container mx-auto px-4 py-8 max-w-5xl">
        <!-- Header -->
        <header class="mb-8">
            <h1 class="text-3xl font-bold text-blue-900">📈 PSE Stock Performance</h1>
            <p class="text-gray-500 mt-1">Interactive historical charts using Yahoo Finance data.</p>
        </header>

        <!-- Controls Section -->
        <div class="bg-white p-6 rounded-t-lg shadow-sm border border-gray-200 border-b-0 flex flex-col md:flex-row justify-between items-center gap-4">
            
            <!-- Stock Selector -->
            <div class="w-full md:w-1/3">
                <label class="block text-sm font-medium text-gray-700 mb-1">Select a PSE Stock</label>
                <select id="stockSelect" onchange="updateChart()" class="w-full border border-gray-300 rounded-md p-2 focus:ring-blue-500 focus:border-blue-500 outline-none bg-white">
                    <option value="ALI.PS">Ayala Land, Inc. (ALI)</option>
                    <option value="SM.PS">SM Investments (SM)</option>
                    <option value="BDO.PS" selected>BDO Unibank (BDO)</option>
                    <option value="JFC.PS">Jollibee Foods (JFC)</option>
                    <option value="AC.PS">Ayala Corporation (AC)</option>
                    <option value="BPI.PS">Bank of the Phil. Islands (BPI)</option>
                    <option value="TEL.PS">PLDT Inc. (TEL)</option>
                    <option value="GLO.PS">Globe Telecom (GLO)</option>
                    <option value="URC.PS">Universal Robina (URC)</option>
                    <option value="MER.PS">Manila Electric (MER)</option>
                    <option value="SMPH.PS">SM Prime Holdings (SMPH)</option>
                    <option value="ICT.PS">ICTSI (ICT)</option>
                </select>
            </div>

            <!-- Time Range Buttons -->
            <div class="w-full md:w-auto">
                <label class="block text-sm font-medium text-gray-700 mb-1 md:text-right">Time Range</label>
                <div class="inline-flex rounded-md shadow-sm" role="group" id="rangeButtons">
                    <button type="button" onclick="setRange('3mo', this)" class="range-btn active bg-blue-600 text-white px-4 py-2 text-sm font-medium border border-blue-600 rounded-l-lg hover:bg-blue-700 transition">3M</button>
                    <button type="button" onclick="setRange('1y', this)" class="range-btn bg-white text-gray-700 px-4 py-2 text-sm font-medium border border-gray-300 hover:bg-gray-100 transition">1Y</button>
                    <button type="button" onclick="setRange('3y', this)" class="range-btn bg-white text-gray-700 px-4 py-2 text-sm font-medium border border-gray-300 hover:bg-gray-100 transition">3Y</button>
                    <button type="button" onclick="setRange('5y', this)" class="range-btn bg-white text-gray-700 px-4 py-2 text-sm font-medium border border-gray-300 hover:bg-gray-100 transition">5Y</button>
                    <button type="button" onclick="setRange('max', this)" class="range-btn bg-white text-gray-700 px-4 py-2 text-sm font-medium border border-gray-300 rounded-r-lg hover:bg-gray-100 transition">MAX</button>
                </div>
            </div>
        </div>

        <!-- Chart Container -->
        <div class="bg-white p-6 rounded-b-lg shadow-sm border border-gray-200 relative">
            
            <!-- Loading Overlay -->
            <div id="loadingOverlay" class="absolute inset-0 bg-white bg-opacity-90 flex flex-col items-center justify-center z-10 hidden rounded-b-lg">
                <svg class="animate-spin h-8 w-8 text-blue-600 mb-2" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                <span class="text-gray-600 font-medium">Fetching Market Data...</span>
            </div>

            <div class="h-[400px] w-full">
                <canvas id="stockChart"></canvas>
            </div>
            <p id="errorMessage" class="text-red-500 text-center mt-4 hidden">Failed to load data. The proxy might be temporarily blocked.</p>
        </div>
    </div>

    <script>
        let currentChart = null;
        let currentRange = '3mo'; // Default range

        // Handle Time Range Button Clicks
        function setRange(range, btnElement) {
            currentRange = range;
            
            // Update button styles (reset all, then highlight clicked)
            document.querySelectorAll('.range-btn').forEach(btn => {
                btn.classList.remove('bg-blue-600', 'text-white', 'border-blue-600');
                btn.classList.add('bg-white', 'text-gray-700', 'border-gray-300');
            });
            btnElement.classList.remove('bg-white', 'text-gray-700', 'border-gray-300');
            btnElement.classList.add('bg-blue-600', 'text-white', 'border-blue-600');

            updateChart();
        }

        // Fetch historical data from Yahoo Finance
        async function fetchChartData(ticker, range) {
            // Adjust the interval based on the range to prevent downloading too much data
            let interval = '1d'; // Daily for 3mo and 1y
            if (range === '3y' || range === '5y') interval = '1wk'; // Weekly for 3-5 years
            if (range === 'max') interval = '1mo'; // Monthly for Max

            // Add a timestamp to bypass proxy caching
            const cacheBuster = Date.now();
            const yahooUrl = `https://query1.finance.yahoo.com/v8/finance/chart/${ticker}?range=${range}&interval=${interval}`;
            const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(yahooUrl)}&t=${cacheBuster}`;

            try {
                const response = await fetch(proxyUrl);
                if (!response.ok) throw new Error("Network response was not ok");
                
                const data = await response.json();
                const result = data.chart.result[0];
                
                // Extract timestamps and closing prices
                const timestamps = result.timestamp;
                const closePrices = result.indicators.quote[0].close;

                // Format data for Chart.js
                const chartData = [];
                for (let i = 0; i < timestamps.length; i++) {
                    // Yahoo sometimes returns nulls for holidays, we skip them
                    if (closePrices[i] !== null) {
                        chartData.push({
                            date: new Date(timestamps[i] * 1000).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }),
                            price: closePrices[i]
                        });
                    }
                }

                return chartData;
            } catch (error) {
                console.error("Error fetching chart data:", error);
                return null;
            }
        }

        // Draw or Update the Chart.js instance
        async function updateChart() {
            const ticker = document.getElementById("stockSelect").value;
            const stockName = document.getElementById("stockSelect").options[document.getElementById("stockSelect").selectedIndex].text;
            
            const loadingOverlay = document.getElementById("loadingOverlay");
            const errorMessage = document.getElementById("errorMessage");

            // Show loading, hide error
            loadingOverlay.classList.remove("hidden");
            errorMessage.classList.add("hidden");

            const data = await fetchChartData(ticker, currentRange);

            loadingOverlay.classList.add("hidden");

            if (!data || data.length === 0) {
                errorMessage.classList.remove("hidden");
                return;
            }

            // Separate dates (x-axis) and prices (y-axis)
            const labels = data.map(item => item.date);
            const prices = data.map(item => item.price);

            // If a chart already exists, destroy it before making a new one
            if (currentChart) {
                currentChart.destroy();
            }

            const ctx = document.getElementById('stockChart').getContext('2d');
            
            // Determine line color based on performance (green if up, red if down)
            const startPrice = prices[0];
            const endPrice = prices[prices.length - 1];
            const lineColor = endPrice >= startPrice ? '#16a34a' : '#dc2626'; // Tailwind green-600 or red-600
            const fillColor = endPrice >= startPrice ? 'rgba(22, 163, 74, 0.1)' : 'rgba(220, 38, 38, 0.1)';

            currentChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: `${stockName} Closing Price (PHP)`,
                        data: prices,
                        borderColor: lineColor,
                        backgroundColor: fillColor,
                        borderWidth: 2,
                        pointRadius: 0, // Hide dots for cleaner line
                        pointHoverRadius: 6, // Show dots when hovering
                        fill: true,
                        tension: 0.1 // Slight curve to the line
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: {
                        mode: 'index',
                        intersect: false,
                    },
                    plugins: {
                        legend: {
                            display: true,
                            position: 'top',
                        },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    return ' ₱' + context.parsed.y.toFixed(2);
                                }
                            }
                        }
                    },
                    scales: {
                        x: {
                            grid: { display: false },
                            ticks: { maxTicksLimit: 8 } // Don't crowd the x-axis with too many dates
                        },
                        y: {
                            grid: { color: '#f1f5f9' },
                            ticks: {
                                callback: function(value) {
                                    return '₱' + value;
                                }
                            }
                        }
                    }
                }
            });
        }

        // Initialize the chart when the page loads
        window.onload = () => {
            updateChart();
        };
    </script>
</body>
</html>
