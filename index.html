<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PSE Stock Performance Chart</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- TradingView Script -->
    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans">

    <div class="container mx-auto px-4 py-8 max-w-6xl">
        <!-- Header -->
        <header class="mb-6">
            <h1 class="text-3xl font-bold text-blue-900">📈 PSE Stock Performance</h1>
            <p class="text-gray-500 mt-1">Institutional-grade charting powered by TradingView. 100% reliable.</p>
        </header>

        <!-- Controls Section -->
        <div class="bg-white p-6 rounded-t-lg shadow-sm border border-gray-200 border-b-0 flex flex-col md:flex-row justify-between items-center gap-4">
            
            <!-- Stock Selector -->
            <div class="w-full md:w-1/3">
                <label class="block text-sm font-medium text-gray-700 mb-1">Select a PSE Stock</label>
                <!-- Notice the values are now formatted as "PSE:TICKER" -->
                <select id="stockSelect" onchange="changeStock()" class="w-full border border-gray-300 rounded-md p-2 focus:ring-blue-500 focus:border-blue-500 outline-none bg-white font-medium">
                    <option value="PSE:ALI">Ayala Land, Inc. (ALI)</option>
                    <option value="PSE:SM">SM Investments (SM)</option>
                    <option value="PSE:BDO" selected>BDO Unibank (BDO)</option>
                    <option value="PSE:JFC">Jollibee Foods (JFC)</option>
                    <option value="PSE:AC">Ayala Corporation (AC)</option>
                    <option value="PSE:BPI">Bank of the Phil. Islands (BPI)</option>
                    <option value="PSE:TEL">PLDT Inc. (TEL)</option>
                    <option value="PSE:GLO">Globe Telecom (GLO)</option>
                    <option value="PSE:URC">Universal Robina (URC)</option>
                    <option value="PSE:MER">Manila Electric (MER)</option>
                    <option value="PSE:SMPH">SM Prime Holdings (SMPH)</option>
                    <option value="PSE:ICT">ICTSI (ICT)</option>
                </select>
            </div>

            <div class="w-full md:w-auto text-sm text-gray-500 italic">
                Tip: Use the bottom toolbar on the chart to change time ranges (1M, 3M, 1Y, 5Y, All).
            </div>
        </div>

        <!-- Chart Container -->
        <div class="bg-white p-1 rounded-b-lg shadow-sm border border-gray-200">
            <!-- This div is where TradingView will inject the chart -->
            <div id="tv_chart_container" class="w-full h-[600px]"></div>
        </div>
    </div>

    <script>
        // Function to create/update the TradingView widget
        function loadChart(symbolToLoad) {
            new TradingView.widget({
                "autosize": true,
                "symbol": symbolToLoad,
                "interval": "D", // Default interval is Daily
                "timezone": "Asia/Manila",
                "theme": "light",
                "style": "3", // "3" is an Area/Mountain chart. Change to "1" if you prefer Candlesticks!
                "locale": "en",
                "enable_publishing": false,
                "backgroundColor": "#ffffff",
                "gridColor": "#f1f5f9",
                "hide_top_toolbar": false,
                "hide_legend": false,
                "save_image": false,
                "container_id": "tv_chart_container"
            });
        }

        // Triggered when dropdown is changed
        function changeStock() {
            const selectedSymbol = document.getElementById("stockSelect").value;
            loadChart(selectedSymbol);
        }

        // Load default stock (BDO) when page first opens
        window.onload = () => {
            loadChart("PSE:BDO");
        };
    </script>
</body>
</html>
